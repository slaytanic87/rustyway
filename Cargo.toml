[package]
name = "rustyway"
version = "0.1.0"
edition = "2024"
readme = "README.md"
exclude = ["migrations/*"]

[lib]
name = "rustyway"
path = "src/lib.rs"

[dependencies]
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
duckdb = { version = "1.20000.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
rust-embed = "8.14.0"
